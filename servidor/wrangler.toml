name = "eventos"
main = "worker.js"
compatibility_date = "2025-06-01"
# bpmtickets.com.ar (and www, which redirects) point to this Worker; the old workers.dev address keeps answering
workers_dev = true
routes = [
  { pattern = "bpmtickets.com.ar", custom_domain = true },
  { pattern = "www.bpmtickets.com.ar", custom_domain = true }
]

[vars]
SITIO = "https://bpmtickets.com.ar"
APP_ORIGIN = "https://bpmtickets.com.ar"
# sites allowed to call the API: the new address and the old GitHub Pages app (to carry its data over)
ORIGENES = "https://bpmtickets.com.ar,https://nicolascapello7.github.io"
APP_FUENTE = "https://nicolascapello7.github.io/crrpp-ec7be04424"
MAIL_DESDE = "BPM Tickets <no-responder@bpmtickets.com.ar>"
GOOGLE_CLIENT_ID = "174152864828-tbk0qlbnm28kak0lvbum8mvi296n2mtj.apps.googleusercontent.com"
# RESEND_API_KEY is a secret: set it in Cloudflare (Workers > eventos > Settings > Variables and Secrets)

[[d1_databases]]
binding = "DB"
database_name = "rrpp-db"
database_id = "4155f35e-8af7-414f-9a39-9ea458760d5b"

# daily copy of accounts, event lists and Mi Rendimiento (see copias.sql); last 30 days kept
[[d1_databases]]
binding = "COPIAS"
database_name = "rrpp-copias"
database_id = "bd8b8a8f-24e3-4fab-a28a-cc3215800072"

[triggers]
crons = ["0 7 * * *"] # every day at 04:00 Argentina

# ---------- STAGING: staging.bpmtickets.com.ar, to try changes before they reach the real app ----------
# Own Worker, own empty database and the app files from this folder (not GitHub Pages); no daily copy.
# Deploy with: bash deploy-staging.sh
[env.staging]
name = "eventos-staging"
workers_dev = false
routes = [
  { pattern = "staging.bpmtickets.com.ar", custom_domain = true }
]

[env.staging.vars]
STAGING = "1"
SITIO = "https://staging.bpmtickets.com.ar"
APP_ORIGIN = "https://staging.bpmtickets.com.ar"
ORIGENES = "https://staging.bpmtickets.com.ar"
MAIL_DESDE = "BPM Tickets (pruebas) <no-responder@bpmtickets.com.ar>"
GOOGLE_CLIENT_ID = "174152864828-tbk0qlbnm28kak0lvbum8mvi296n2mtj.apps.googleusercontent.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "rrpp-db-staging"
database_id = "42c7f997-ed0c-4d57-bcfb-367d97798122"

[env.staging.assets]
directory = "./.staging-app"
binding = "ASSETS"

[env.staging.triggers]
crons = []
