  // ---------- backup / export ----------
  function entregarArchivo(contenido, nombre, tipo) {
    var blob = new Blob([contenido], { type: tipo });
    var file = null;
    try { file = new File([blob], nombre, { type: tipo }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: nombre }).then(function () { return true; }, function (e) {
        return e && e.name === "AbortError" ? false : descargar(blob, nombre);
      });
    }
    return Promise.resolve(descargar(blob, nombre));
  }
  function descargar(blob, nombre) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  }

  function exportJson() {
    var payload = { app: "comisiones-rrpp", version: 2, exportado: new Date().toISOString(), pct: data.pct, productoras: data.productoras, eventos: data.eventos, cartelera: data.cartelera };
    entregarArchivo(JSON.stringify(payload, null, 2), "comisiones-rrpp-" + hoy() + ".json", "application/json").then(function (ok) {
      if (!ok) return;
      data.ultimaCopia = new Date().toISOString();
      persist();
      render();
      toast("Copia lista");
    });
  }

  function exportCsv() {
    function n(x) { return String(Math.round(x * 100) / 100).replace(".", ","); }
    function q(s) { s = String(s == null ? "" : s); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    var ESTADOS = { pendiente: "Pendiente", facturada: "Facturada", cobrada: "Cobrada" };
    var filas = [["Evento", "Fecha", "Productora", "Entradas", "Facturado", "% comisión", "Comisión", "Frees", "Valor free", "Monto frees", "Total a cobrar", "Estado", "Fecha de cobro"].join(";")];
    ordenados().forEach(function (ev) {
      var pr = prod(ev.productoraId);
      filas.push([q(ev.nombre), fechaCorta(ev.fecha), q(pr ? pr.nombre : ""), ev.entradas || 0, n(Number(ev.facturado) || 0), n(pctDe(ev)), n(comision(ev)),
        tieneFrees(ev) ? ev.frees : "", tieneFrees(ev) ? n(valorFree(ev)) : "", tieneFrees(ev) ? n(montoFrees(ev)) : "", n(totalEvento(ev)),
        ESTADOS[estado(ev)], ev.cobrado ? fechaCorta(ev.fechaCobro) : ""].join(";"));
    });
    entregarArchivo("﻿" + filas.join("\r\n"), "comisiones-rrpp-" + hoy() + ".csv", "text/csv").then(function (ok) {
      if (ok) toast("Planilla lista");
    });
  }

  function leerImport(file) {
    var err = document.getElementById("import-err");
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || d.app !== "comisiones-rrpp" || !Array.isArray(d.eventos)) throw new Error("formato");
        var eventos = d.eventos.filter(function (e) { return e && typeof e.nombre === "string" && partes(e.fecha); }).map(function (e) {
          return { id: String(e.id || nuevoId()), nombre: e.nombre, fecha: e.fecha, entradas: Number(e.entradas) || 0, facturado: Number(e.facturado) || 0,
            cobrado: !!e.cobrado, fechaCobro: e.cobrado ? (e.fechaCobro || null) : null,
            pctPropio: typeof e.pctPropio === "number" ? e.pctPropio : null,
            productoraId: e.productoraId ? String(e.productoraId) : null,
            facturada: !!e.facturada, fechaFactura: e.facturada ? (e.fechaFactura || null) : null,
            frees: typeof e.frees === "number" ? e.frees : null,
            valorFreeCobrado: e.cobrado && typeof e.valorFreeCobrado === "number" ? e.valorFreeCobrado : null,
            pctCobrado: e.cobrado && typeof e.pctCobrado === "number" ? e.pctCobrado : null, creado: e.creado || new Date().toISOString() };
        });
        var productoras = Array.isArray(d.productoras) ? d.productoras.filter(function (p) { return p && p.id && typeof p.nombre === "string"; })
          .map(function (p) { return { id: String(p.id), nombre: p.nombre, factura: !!p.factura, valorFree: typeof p.valorFree === "number" ? p.valorFree : null }; }) : null;
        ui.pendingImport = { eventos: eventos, productoras: productoras, cartelera: Array.isArray(d.cartelera) ? d.cartelera : null, pct: typeof d.pct === "number" ? d.pct : null, exportado: d.exportado || null };
        render();
      } catch (e) {
        if (err) err.textContent = "Ese archivo no es una copia de esta app. Elegí el archivo comisiones-rrpp-….json que guardaste.";
      }
    };
    reader.onerror = function () { if (err) err.textContent = "No se pudo leer el archivo."; };
    reader.readAsText(file);
  }

  function confirmarImport() {
    var p = ui.pendingImport;
    if (!p) return;
    var antes = { pct: data.pct, eventos: data.eventos, productoras: data.productoras, cartelera: data.cartelera };
    data.eventos = p.eventos;
    if (p.productoras) data.productoras = p.productoras;
    if (p.cartelera) data.cartelera = p.cartelera;
    if (p.pct != null) data.pct = p.pct;
    if (!persist()) { data.pct = antes.pct; data.eventos = antes.eventos; data.productoras = antes.productoras; data.cartelera = antes.cartelera; return; }
    ui.pendingImport = null;
    render();
    toast("Copia restaurada: " + p.eventos.length + " eventos");
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-view],[data-filtro],[data-rank],[data-edit],[data-pct],[data-pe],[data-toggle],[data-facturar],[data-prod-edit],[data-panel],[data-rango],[data-cartel-actualizar],[data-cartel-borrar-ok],[data-cartel-borrar],[data-cartel-prod],[data-cartel-editar],[data-action]");
    if (!t) return;
    if (t.hasAttribute("data-facturar")) { marcarFacturada(t.getAttribute("data-facturar")); return; }
    if (t.hasAttribute("data-cartel-prod")) { ui.cartelProd = t.getAttribute("data-cartel-prod"); render(); return; }
    if (t.hasAttribute("data-cartel-editar")) { editarCartel(t.getAttribute("data-cartel-editar")); return; }
    if (t.hasAttribute("data-cartel-actualizar")) { actualizarCartel(t.getAttribute("data-cartel-actualizar")); return; }
    if (t.hasAttribute("data-cartel-borrar")) {
      // always opens (never toggles) so a doubled tap cannot open and close it at once
      ui.cartelBorrar = t.getAttribute("data-cartel-borrar");
      render();
      var conf = document.querySelector(".cartel-confirm");
      if (conf) conf.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    if (t.hasAttribute("data-cartel-borrar-ok")) { borrarCartel(t.getAttribute("data-cartel-borrar-ok")); return; }
    if (t.hasAttribute("data-panel")) {
      if (t.getAttribute("data-panel") === "ev") ui.panelEv = !ui.panelEv; else ui.panelRend = !ui.panelRend;
      render();
      return;
    }
    if (t.hasAttribute("data-rango")) {
      var rr = rango(t.getAttribute("data-rango"));
      var fr = t.getAttribute("data-scope") === "ev" ? ui.filtroEv : ui.filtroRend;
      fr.desde = rr[0]; fr.hasta = rr[1];
      render();
      return;
    }
    if (t.hasAttribute("data-prod-edit")) {
      ui.editProd = t.getAttribute("data-prod-edit"); ui.prodBorrar = false; render();
      var pn = document.getElementById("pe-nombre"); if (pn) pn.closest(".prod-row").scrollIntoView({ block: "nearest", behavior: "smooth" });
      return;
    }
    if (t.hasAttribute("data-view")) { ui.view = t.getAttribute("data-view"); ui.editPct = null; ui.editProd = null; ui.prodBorrar = false; ui.cartelBorrar = null; render(); document.getElementById("scroller").scrollTop = 0; if (ui.view === "cartelera") actualizarTodos(); return; }
    if (t.hasAttribute("data-filtro")) { ui.filtro = t.getAttribute("data-filtro"); render(); return; }
    if (t.hasAttribute("data-rank")) { ui.rankBy = t.getAttribute("data-rank"); render(); return; }
    if (t.hasAttribute("data-edit")) { openSheet(t.getAttribute("data-edit")); return; }
    if (t.hasAttribute("data-pct")) {
      var pid = t.getAttribute("data-pct");
      ui.editPct = ui.editPct === pid ? null : pid;
      render();
      if (ui.editPct) {
        var pi = document.getElementById("pe-input");
        pi.focus();
        try { pi.setSelectionRange(0, pi.value.length); } catch (err) { /* ignore */ }
        document.getElementById("pe-form").scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
      return;
    }
    if (t.hasAttribute("data-pe")) {
      document.getElementById("pe-input").value = pctf.format(Number(t.getAttribute("data-pe")));
      previewPct();
      return;
    }
    if (t.hasAttribute("data-toggle")) { togglePago(t.getAttribute("data-toggle")); return; }
    var a = t.getAttribute("data-action");
    if (a === "new") openSheet(null);
    else if (a === "cartel-nuevo") abrirCartel();
    else if (a === "c-manual") {
      var lk = extraerLink((document.getElementById("c-link") || {}).value);
      cartelSheet = { fase: "manual", datos: Object.assign({}, cartelSheet.datos || {}, { link: lk }) };
      pintarCartelSheet();
    }
    else if (a === "c-pegar") {
      var ci = document.getElementById("c-link");
      try {
        navigator.clipboard.readText().then(function (txt) { ci.value = extraerLink(txt); }, function () { ci.focus(); toast("Mantené apretado el campo y elegí Pegar"); });
      } catch (err) { ci.focus(); toast("Mantené apretado el campo y elegí Pegar"); }
    }
    else if (a === "close") closeSheet();
    else if (a === "close-bg" && e.target === t) closeSheet();
    else if (a === "delete") pedirConfirmacionBorrado();
    else if (a === "delete-ok") deleteFromSheet();
    else if (a === "delete-no") { var dc = document.getElementById("f-del-confirm"); if (dc) dc.remove(); var db = document.getElementById("f-del"); if (db) db.hidden = false; }
    else if (a === "c-borrar") { cartelSheet.confirmarBorrado = true; pintarCartelSheet(); var sc = document.querySelector(".sheet-confirm"); if (sc) sc.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    else if (a === "c-borrar-no") { cartelSheet.confirmarBorrado = false; pintarCartelSheet(); }
    else if (a === "c-borrar-ok") { var cid = cartelSheet.datos && cartelSheet.datos.id; closeSheet(); if (cid) borrarCartel(cid); }
    else if (a === "export-json") exportJson();
    else if (a === "export-csv") exportCsv();
    else if (a === "import-confirm") confirmarImport();
    else if (a === "import-cancel") { ui.pendingImport = null; render(); }
    else if (a === "cartel-borrar-no") { ui.cartelBorrar = null; render(); }
    else if (a === "perfil-guardar") guardarPerfil("perfil-nombre", "perfil-err");
    else if (a === "perfil-guardar-ajustes") guardarPerfil("ajustes-nombre", "ajustes-err");
    else if (a === "link-compartir") compartirLink();
    else if (a === "link-copiar") copiarTexto(linkPublico());
    else if (a === "salir") salir();
    else if (a === "pct-cancel") { ui.editPct = null; render(); curarLuego(); }
    else if (a === "prod-cancel") { ui.editProd = null; ui.prodBorrar = false; render(); curarLuego(); }
    else if (a === "prod-delete") borrarProductora();
    else if (a === "filtro-limpiar") {
      if (t.getAttribute("data-scope") === "ev") ui.filtroEv = { desde: "", hasta: "", prod: "" };
      else ui.filtroRend = { desde: "", hasta: "" };
      render();
    }
    else if (a === "filtro-cerrar") {
      if (t.getAttribute("data-scope") === "ev") ui.panelEv = false; else ui.panelRend = false;
      render(); curarLuego();
    }
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "ev-form") saveSheet();
    else if (e.target.id === "cartel-form") { if (cartelSheet.fase === "link") buscarCartel(); else if (cartelSheet.fase !== "buscando") guardarCartel(); }
    else if (e.target.id === "pe-form") guardarPctFecha();
    else if (e.target.id === "pct-form") savePct();
    else if (e.target.id === "prod-add-form") agregarProductora();
    else if (e.target.id === "prod-form") guardarProductora();
  });
  // Thousands mask: "2527000" -> "2.527.000" while typing, keeping the caret after the same digit
  function maskMiles(el) {
    var pos = el.selectionStart == null ? el.value.length : el.selectionStart;
    var digitosAntes = el.value.slice(0, pos).replace(/\D/g, "").length;
    var digitos = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 13);
    var out = digitos.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    if (out === el.value) return;
    el.value = out;
    var i = 0, c = 0;
    while (i < out.length && c < digitosAntes) { if (out[i] !== ".") c++; i++; }
    try { el.setSelectionRange(i, i); } catch (err) { /* not focused */ }
  }

  document.addEventListener("input", function (e) {
    if (e.target.classList && e.target.classList.contains("miles")) maskMiles(e.target);
    if (e.target.id === "f-facturado" || e.target.id === "f-pctev" || e.target.id === "f-frees" || e.target.id === "f-np-free") updatePreview();
    if (e.target.id === "pe-input") previewPct();
    if (e.target.id === "perfil-nombre") {
      var pv = document.getElementById("perfil-preview");
      if (pv) pv.textContent = API_URL.replace("https://", "") + "/" + (slugDe(e.target.value) || "tu-nombre");
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "f-frees-on") {
      var fi = document.getElementById("f-frees");
      fi.hidden = !e.target.checked;
      if (e.target.checked) fi.focus();
      updatePreview();
    } else if (e.target.id === "ev-desde" || e.target.id === "ev-hasta" || e.target.id === "rend-desde" || e.target.id === "rend-hasta") {
      var partesId = e.target.id.split("-");
      var obj = partesId[0] === "ev" ? ui.filtroEv : ui.filtroRend;
      obj[partesId[1]] = e.target.value || "";
      render();
    } else if (e.target.id === "ev-prod") {
      ui.filtroEv.prod = e.target.value;
      render();
    } else if (e.target.id === "f-cobrado") {
      document.getElementById("f-fcobro").hidden = !e.target.checked;
      updatePreview();
    } else if (e.target.id === "f-prod" || e.target.id === "f-np-factura") {
      var sel = document.getElementById("f-prod").value;
      var nueva = sel === "__nueva";
      document.getElementById("f-np-wrap").hidden = !nueva;
      if (nueva && e.target.id === "f-prod") document.getElementById("f-np-nombre").focus();
      updatePreview();
      var block = document.getElementById("f-fact-block");
      if (block) {
        var p = prod(sel);
        block.hidden = !(nueva ? document.getElementById("f-np-factura").checked : p && p.factura);
      }
    } else if (e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      leerImport(e.target.files[0]);
      e.target.value = "";
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $sheetRoot.innerHTML) closeSheet();
  });

  window.addEventListener("resize", ajustarChips);

  // ---------- iOS home-screen viewport heal ----------
  // In standalone mode iOS shrinks the viewport the first time the keyboard opens and never grows it
  // back, leaving a dead band under the bottom bar. Hiding and re-showing the full-height shell after
  // the keyboard closes forces WebKit to re-measure and restores the full height.
  var maxAlto = window.innerHeight;
  window.addEventListener("resize", function () { maxAlto = Math.max(maxAlto, window.innerHeight); });

  function curarViewport() {
    var foco = document.activeElement;
    var escribiendo = foco && (foco.tagName === "INPUT" || foco.tagName === "TEXTAREA" || foco.tagName === "SELECT");
    if (!escribiendo && (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop)) {
      window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
    }
    if (maxAlto - window.innerHeight <= 4) return;
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return; // keyboard still open
    var shell = document.querySelector(".shell");
    var scroller = document.getElementById("scroller");
    var st = scroller ? scroller.scrollTop : 0;
    shell.style.display = "none";
    void shell.offsetHeight;
    shell.style.display = "";
    if (scroller) scroller.scrollTop = st;
  }
  // The page itself never scrolls (only the content area does); undo any shift iOS leaves behind
  window.addEventListener("scroll", function () {
    var foco = document.activeElement;
    if (foco && (foco.tagName === "INPUT" || foco.tagName === "TEXTAREA" || foco.tagName === "SELECT")) return;
    if (window.scrollY) setTimeout(curarViewport, 50);
  });
  document.addEventListener("focusout", function (e) {
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) {
      setTimeout(curarViewport, 140);
      setTimeout(curarViewport, 600);
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") setTimeout(curarViewport, 300);
  });

  // ---------- start ----------
  load();
  sumarProductorasFaltantes();
  leerCuenta();
  render();
  traerCuenta();
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ("serviceWorker" in navigator) {
    // Check for a new version on every open; reload once when it takes over (data is untouched)
    var habiaControlador = !!navigator.serviceWorker.controller;
    var recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!habiaControlador || recargando) { habiaControlador = true; return; }
      recargando = true;
      location.reload();
    });
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.update().catch(function () {});
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reg.update().catch(function () {});
      });
    }).catch(function () {});
  }
})();
</script>
